<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Quiz</title>
    <meta name="theme-color" content="#4f46e5" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript
      ><link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap"
        rel="stylesheet"
    /></noscript>
    <style>
      :root {
        --bg: #f5f4ff;
        --card: #fff;
        --ink: #1e1b4b;
        --mut: #625f8a;
        --line: #e1def7;
        --pri: #4f46e5;
        --pri2: #4338ca;
        --ok: #10b981;
        --gold: #f59e0b;
        --cur: #0ea5e9;
        --bad: #f43f5e;
        --grad: linear-gradient(135deg, #4338ca, #6366f1 55%, #8b5cf6);
        --ez: cubic-bezier(0.22, 1, 0.36, 1);
      }
      [hidden] {
        display: none !important;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          700 16px/1.6 Cairo,
          Tahoma,
          sans-serif;
      }
      .w {
        max-width: 780px;
        margin: auto;
        padding: 16px 16px 40px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 20px;
        margin-bottom: 14px;
      }
      h1 {
        font-size: clamp(24px, 6vw, 32px);
        line-height: 1.2;
        margin: 0 0 6px;
        font-weight: 800;
      }
      h2 {
        font-size: 18px;
        margin: 0 0 10px;
      }
      .mut {
        color: var(--mut);
        font-weight: 600;
      }
      .brand {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 10px;
        margin-bottom: 14px;
      }
      .brand b {
        font-size: 20px;
        color: var(--pri);
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin: 16px 0;
      }
      .stats div {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px;
        text-align: center;
      }
      .stats b {
        display: block;
        font-size: 28px;
        color: var(--pri);
        line-height: 1.2;
      }
      ul.r {
        margin: 0 0 16px;
        padding-left: 20px;
        font-weight: 600;
        color: var(--mut);
      }
      input,
      textarea,
      select {
        width: 100%;
        font: inherit;
        font-weight: 600;
        padding: 10px 12px;
        border: 2px solid var(--line);
        border-radius: 10px;
        background: #fff;
        color: var(--ink);
        margin-top: 6px;
      }
      textarea {
        min-height: 84px;
        resize: vertical;
      }
      input[type="checkbox"] {
        width: auto;
        margin: 0 6px 0 0;
      }
      input:focus,
      textarea:focus,
      select:focus,
      button:focus-visible {
        outline: 3px solid #c4bdfc;
        border-color: var(--pri);
      }
      label {
        display: block;
        margin-top: 12px;
        font-size: 14px;
        color: var(--mut);
      }
      button {
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        border: 0;
        border-radius: 10px;
        padding: 10px 18px;
        background: var(--pri);
        color: #fff;
        transition:
          background 0.15s,
          transform 0.1s;
      }
      button:active:not(:disabled) {
        transform: scale(0.97);
      }
      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .g {
        background: #ebe9fd;
        color: var(--ink);
      }
      .g:hover:not(:disabled) {
        background: #ddd9fb;
      }
      .dg {
        background: #ffe9ee;
        color: var(--bad);
      }
      .dg:hover:not(:disabled) {
        background: #ffd6df;
      }
      .sm {
        padding: 4px 10px;
      }
      .go {
        width: 100%;
        font-size: 18px;
        margin-top: 12px;
      }
      .bar {
        position: sticky;
        top: 0;
        z-index: 5;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px 16px;
        margin-bottom: 14px;
      }
      .t,
      .nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .nav > div,
      .acts {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .tm {
        font-size: 22px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }
      .tm.low {
        color: var(--bad);
      }
      .pg {
        height: 8px;
        background: #e6e4fa;
        border-radius: 8px;
        margin-top: 8px;
        overflow: hidden;
      }
      .pg i {
        display: block;
        height: 100%;
        background: var(--pri);
        transition: width 0.4s;
      }
      .chip {
        display: inline-block;
        font-size: 13px;
        color: var(--pri);
        border: 1px solid var(--pri);
        border-radius: 99px;
        padding: 0 12px;
        margin: 0 6px 8px 0;
      }
      .chip.on {
        background: var(--ok);
        border-color: var(--ok);
        color: #fff;
      }
      .chip.off {
        color: var(--mut);
        border-color: var(--line);
      }
      .ps {
        background: #f3f2ff;
        border-left: 4px solid var(--pri);
        border-radius: 8px;
        padding: 10px 14px;
        margin: 8px 0;
        font-weight: 600;
        max-height: 230px;
        overflow: auto;
      }
      .st {
        font-size: 18px;
        margin: 8px 0 12px;
      }
      .info {
        background: #f3f2ff;
        border-radius: 8px;
        padding: 8px 12px;
        margin: 8px 0;
      }
      .card img.m {
        max-width: 100%;
        border-radius: 10px;
        margin: 6px 0;
      }
      audio {
        width: 100%;
        margin: 6px 0;
      }
      .o {
        display: flex;
        gap: 12px;
        align-items: center;
        width: 100%;
        text-align: left;
        background: #fff;
        color: var(--ink);
        border: 2px solid var(--line);
        margin: 8px 0;
        padding: 10px 14px;
        font-weight: 600;
      }
      .o:hover:not(:disabled) {
        background: #f3f2ff;
        border-color: #a9a2f5;
      }
      .o b {
        min-width: 30px;
        height: 30px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        background: #ebe9fd;
        color: var(--pri);
      }
      .o.s {
        border-color: var(--pri);
        background: #ebe9ff;
      }
      .o.s b {
        background: var(--pri);
        color: #fff;
      }
      .tf {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .tf .o {
        justify-content: center;
        margin: 0;
      }
      .mr {
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
        padding: 6px 0;
        border-bottom: 1px solid var(--line);
      }
      .mr select {
        max-width: 55%;
        margin: 0;
      }
      .fl.on {
        background: var(--gold);
        color: #3b2600;
      }
      .dr {
        position: fixed;
        inset: 0;
        background: rgba(15, 25, 40, 0.55);
        display: grid;
        place-items: center;
        z-index: 20;
        padding: 16px;
      }
      .dr > div {
        background: #fff;
        border-radius: 16px;
        padding: 20px;
        width: min(100%, 560px);
        max-height: 92vh;
        overflow: auto;
        animation: in 0.2s;
      }
      @keyframes in {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
      }
      .gd {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(46px, 1fr));
        gap: 8px;
        margin: 12px 0;
      }
      .gd button {
        padding: 8px 0;
        color: #fff;
        background: var(--bad);
      }
      .gd .a {
        background: var(--ok);
      }
      .gd .f {
        background: var(--gold);
        color: #3b2600;
      }
      .gd .c {
        background: var(--cur);
        outline: 3px solid #bae6fd;
      }
      .lgd {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        font-size: 13px;
        color: var(--mut);
      }
      .lgd i {
        display: inline-block;
        width: 12px;
        height: 12px;
        border-radius: 3px;
        margin-right: 5px;
        vertical-align: -1px;
      }
      .row {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 8px 12px;
        border-radius: 10px;
        margin: 6px 0;
        background: #f3f2ff;
      }
      .row b {
        flex: 1;
      }
      .row .n {
        min-width: 30px;
        text-align: center;
      }
      .ring {
        width: 150px;
        height: 150px;
        margin: auto;
        position: relative;
      }
      .ring svg {
        transform: rotate(-90deg);
      }
      .ring div {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 30px;
        font-weight: 800;
      }
      .rv {
        border-left: 5px solid var(--bad);
      }
      .rv.ok {
        border-left-color: var(--ok);
      }
      .rv.mid {
        border-left-color: var(--gold);
      }
      .rv p {
        margin: 4px 0;
        font-weight: 600;
        white-space: pre-wrap;
      }
      .err {
        color: var(--bad);
        margin: 8px 0;
        font-weight: 600;
      }
      .g2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      th,
      td {
        text-align: left;
        padding: 6px 8px;
        border-bottom: 1px solid var(--line);
      }
      .sc {
        overflow: auto;
      }
      .rp {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 26px;
      }
      .rp h1 {
        font-size: 24px;
      }
      .rp h2 {
        margin-top: 18px;
      }
      .rp table {
        font-size: 13px;
      }
      .rp tr {
        break-inside: avoid;
      }
      .rp ul {
        margin: 6px 0;
        padding-left: 20px;
        font-weight: 600;
      }
      @page {
        margin: 14mm;
      }
      @media print {
        body {
          background: #fff;
        }
        .np,
        .dr {
          display: none !important;
        }
        .w {
          max-width: none;
          padding: 0;
        }
        .rp {
          border: 0;
          padding: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
    <style id="ui2">
      html {
        scroll-behavior: smooth;
      }
      body {
        background:
          #f5f4ff
            radial-gradient(900px 520px at 8% -8%, #e0e7ff 0, transparent 60%)
            fixed,
          radial-gradient(760px 460px at 100% 2%, #fce7f3 0, transparent 55%)
            fixed,
          radial-gradient(900px 520px at 50% 115%, #d1fae5 0, transparent 58%)
            fixed;
        background-repeat: no-repeat;
      }
      .w {
        position: relative;
        z-index: 1;
      }
      h1,
      h2 {
        letter-spacing: -0.01em;
      }

      #bg {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        z-index: 0;
      }
      #bg span {
        position: absolute;
        transition: transform 0.9s var(--ez);
        transform: translate(
          calc(var(--mx, 0) * var(--d) * 1px),
          calc(var(--my, 0) * var(--d) * 1px)
        );
      }
      #bg svg {
        width: 100%;
        height: 100%;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0.26;
        animation: fl var(--t) ease-in-out var(--dl) infinite;
      }
      @keyframes fl {
        0%,
        100% {
          transform: translateY(0) rotate(var(--r));
        }
        50% {
          transform: translateY(-26px) rotate(calc(var(--r) + 10deg));
        }
      }

      .card {
        background: rgba(255, 255, 255, 0.86);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.95);
        border-radius: 18px;
        box-shadow:
          0 1px 2px rgba(30, 27, 75, 0.04),
          0 16px 36px -22px rgba(49, 46, 129, 0.4);
        transition:
          transform 0.35s var(--ez),
          box-shadow 0.35s var(--ez),
          border-color 0.35s;
      }
      .card:hover {
        border-color: #d9d6fb;
        box-shadow: 0 24px 44px -24px rgba(49, 46, 129, 0.5);
      }
      .card:not(:has(input, textarea, select, .st)):hover {
        transform: translateY(-3px);
      }
      .bar {
        background: rgba(255, 255, 255, 0.88);
        -webkit-backdrop-filter: blur(14px);
        backdrop-filter: blur(14px);
        border-color: rgba(255, 255, 255, 0.95);
        box-shadow: 0 12px 28px -20px rgba(49, 46, 129, 0.5);
      }

      @keyframes up {
        from {
          opacity: 0;
          transform: translateY(18px);
        }
      }
      #app > * {
        animation: up 0.55s var(--ez) backwards;
      }
      #app > *:nth-child(2) {
        animation-delay: 0.07s;
      }
      #app > *:nth-child(3) {
        animation-delay: 0.14s;
      }
      #app > *:nth-child(4) {
        animation-delay: 0.2s;
      }
      #app > *:nth-child(5) {
        animation-delay: 0.26s;
      }
      #app > *:nth-child(6) {
        animation-delay: 0.31s;
      }
      #app > *:nth-child(7) {
        animation-delay: 0.35s;
      }
      #app > *:nth-child(8) {
        animation-delay: 0.39s;
      }
      #app > *:nth-child(n + 9) {
        animation-delay: 0.42s;
      }
      #app.na > * {
        animation: none;
      }

      button {
        position: relative;
        overflow: hidden;
        background: var(--grad);
        box-shadow: 0 10px 20px -12px rgba(79, 70, 229, 0.9);
        transition:
          transform 0.25s var(--ez),
          box-shadow 0.25s var(--ez),
          background 0.25s,
          filter 0.25s,
          opacity 0.25s;
      }
      button:hover:not(:disabled) {
        filter: brightness(1.08);
        transform: translateY(-2px);
        box-shadow: 0 16px 26px -14px rgba(79, 70, 229, 0.95);
      }
      button:active:not(:disabled) {
        transform: translateY(0) scale(0.97);
        box-shadow: 0 6px 12px -8px rgba(79, 70, 229, 0.8);
      }
      button:disabled {
        box-shadow: none;
      }
      .g,
      .dg,
      .o,
      .fl {
        box-shadow: none;
      }
      .g:hover:not(:disabled),
      .dg:hover:not(:disabled),
      .o:hover:not(:disabled) {
        filter: none;
        box-shadow: 0 12px 20px -14px rgba(79, 70, 229, 0.6);
      }
      .g:hover:not(:disabled) {
        transform: translateY(-2px);
      }
      .dg:hover:not(:disabled) {
        background: #ffd6df;
      }
      .gd button {
        box-shadow: none;
      }
      .gd button:hover:not(:disabled) {
        transform: translateY(-2px) scale(1.08);
        filter: brightness(1.1);
        box-shadow: 0 10px 16px -10px rgba(30, 27, 75, 0.6);
      }
      .rip {
        position: absolute;
        border-radius: 50%;
        background: currentColor;
        pointer-events: none;
        transform: scale(0);
        animation: rp 0.6s ease-out forwards;
      }
      @keyframes rp {
        from {
          transform: scale(0);
          opacity: 0.28;
        }
        to {
          transform: scale(1);
          opacity: 0;
        }
      }

      input,
      textarea,
      select {
        border-radius: 12px;
        transition:
          border-color 0.2s,
          box-shadow 0.2s,
          background 0.2s;
      }
      input:hover,
      textarea:hover,
      select:hover {
        border-color: #c9c4f5;
      }
      input:focus,
      textarea:focus,
      select:focus {
        box-shadow: 0 0 0 5px rgba(79, 70, 229, 0.14);
      }

      .o {
        border-radius: 14px;
        transition:
          transform 0.25s var(--ez),
          border-color 0.2s,
          background 0.2s,
          box-shadow 0.25s;
      }
      .o:hover:not(:disabled) {
        transform: translateX(5px);
      }
      .tf .o:hover:not(:disabled) {
        transform: translateY(-3px);
      }
      .o b {
        transition:
          background 0.25s,
          color 0.25s,
          transform 0.25s var(--ez);
      }
      .o:hover:not(:disabled) b {
        background: var(--pri);
        color: #fff;
        transform: scale(1.08);
      }
      .o.s {
        background: linear-gradient(90deg, #eceafe, #fff);
        box-shadow: 0 12px 22px -16px rgba(79, 70, 229, 0.8);
      }
      .o.s b {
        background: var(--grad);
        color: #fff;
        animation: pop 0.4s var(--ez);
      }
      @keyframes pop {
        0% {
          transform: scale(0.55);
        }
        60% {
          transform: scale(1.22);
        }
        100% {
          transform: scale(1);
        }
      }

      .pg {
        height: 10px;
        border-radius: 10px;
      }
      .pg i {
        border-radius: 10px;
        background-image:
          linear-gradient(
            90deg,
            transparent,
            rgba(255, 255, 255, 0.55),
            transparent
          ),
          var(--grad);
        background-size:
          220% 100%,
          100% 100%;
        animation: sh 2.2s linear infinite;
        transition: width 0.6s var(--ez);
      }
      @keyframes sh {
        from {
          background-position:
            220% 0,
            0 0;
        }
        to {
          background-position:
            -220% 0,
            0 0;
        }
      }
      .tm.low {
        animation: pl 1s ease-in-out infinite;
      }
      @keyframes pl {
        50% {
          transform: scale(1.12);
        }
      }
      .stats div {
        background: linear-gradient(180deg, #fff, #f6f5ff);
        border-radius: 14px;
        transition:
          transform 0.3s var(--ez),
          box-shadow 0.3s var(--ez),
          border-color 0.3s;
      }
      .stats div:hover {
        transform: translateY(-4px);
        border-color: #c9c4f5;
        box-shadow: 0 16px 24px -18px rgba(79, 70, 229, 0.7);
      }
      .chip {
        transition:
          background 0.25s,
          color 0.25s,
          transform 0.25s var(--ez);
      }
      .chip:hover {
        transform: translateY(-1px);
      }
      .t .chip.on::before {
        content: "";
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #fff;
        margin-right: 7px;
        vertical-align: 1px;
        animation: dot 1.6s ease-out infinite;
      }
      @keyframes dot {
        0% {
          box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.8);
        }
        100% {
          box-shadow: 0 0 0 8px rgba(255, 255, 255, 0);
        }
      }

      .mr {
        border-radius: 10px;
        transition:
          background 0.2s,
          padding 0.25s var(--ez);
      }
      .mr:hover {
        background: #f3f2ff;
        padding-left: 8px;
        padding-right: 8px;
      }
      tr {
        transition: background 0.2s;
      }
      tbody tr:hover td,
      table tr:hover td {
        background: #f6f5ff;
      }
      .row {
        border-radius: 14px;
        transition:
          transform 0.3s var(--ez),
          box-shadow 0.3s var(--ez);
        animation: up 0.5s var(--ez) backwards;
      }
      .row:hover {
        transform: translateX(5px);
        box-shadow: 0 12px 20px -16px rgba(79, 70, 229, 0.6);
      }
      #lb .row:nth-of-type(1) {
        background: linear-gradient(90deg, #fff3cd, #fffaf0);
      }
      #lb .row:nth-of-type(2) {
        background: linear-gradient(90deg, #e8ecf5, #f7f8fc);
      }
      #lb .row:nth-of-type(3) {
        background: linear-gradient(90deg, #fde3cf, #fff6ee);
      }
      #lb .row:nth-of-type(2) {
        animation-delay: 0.06s;
      }
      #lb .row:nth-of-type(3) {
        animation-delay: 0.12s;
      }
      #lb .row:nth-of-type(4) {
        animation-delay: 0.18s;
      }
      #lb .row:nth-of-type(n + 5) {
        animation-delay: 0.24s;
      }

      .dr {
        background: rgba(30, 27, 75, 0.5);
        -webkit-backdrop-filter: blur(5px);
        backdrop-filter: blur(5px);
        animation: fd 0.25s ease;
      }
      @keyframes fd {
        from {
          opacity: 0;
        }
      }
      .dr > div {
        border-radius: 20px;
        box-shadow: 0 40px 80px -30px rgba(30, 27, 75, 0.7);
        animation: pin 0.38s var(--ez);
      }
      @keyframes pin {
        from {
          opacity: 0;
          transform: translateY(20px) scale(0.96);
        }

.kp{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 4px 14px rgba(79,70,229,.06)}
.kp i{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-style:normal;font-size:22px;flex:none}
.kp b{display:block;font-size:26px;line-height:1.1;color:var(--ink)}.kp span{color:var(--mut);font-size:14px}
.qg{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;align-items:start}.qg .card{margin:0}
.fb{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.fb input{flex:1;min-width:220px;margin:0}
@media(max-width:900px){
.sb{transform:translateX(-100%)}body.sbo .sb{transform:none}
.ov{position:fixed;inset:0;background:rgba(15,13,50,.5);z-index:40}body.sbo .ov{display:block}
.tb{display:flex;align-items:center;gap:12px;position:fixed;top:0;left:0;right:0;height:54px;padding:0 14px;z-index:30;background:#fff;border-bottom:1px solid var(--line)}
.tb b{color:var(--pri);font-size:18px}.hb{padding:6px 12px;font-size:20px;line-height:1}
.mn{margin-left:0;padding:70px 14px 40px}.qg{grid-template-columns:1fr}}
body.adm.dk{--bg:#0d1020;--card:#171b36;--ink:#e8eaff;--mut:#a3a9d6;--line:#2b3157;--pri:#818cf8;--pri2:#6366f1;background:#0d1020!important;color:var(--ink)}
body.adm.dk .card,body.adm.dk .kp,body.adm.dk .rp{background:var(--card);border-color:var(--line)}
body.adm.dk input,body.adm.dk textarea,body.adm.dk select{background:#10142b;color:var(--ink);border-color:var(--line)}
body.adm.dk ::placeholder{color:#7f86b8}
body.adm.dk .g{background:#242a52;color:var(--ink)}
body.adm.dk .g:hover:not(:disabled){background:#2e3566}
body.adm.dk .info,body.adm.dk .ps{background:#1d2245;color:var(--ink)}
body.adm.dk .tb{background:#171b36;border-color:var(--line)}
body.adm.dk .tb b{color:#c7d2fe}
body.adm.dk th{color:var(--ink)}
body.adm.dk .chip{color:#c7d2fe;border-color:#6366f1}
body.adm.dk .chip.on{background:var(--ok);border-color:var(--ok);color:#fff}
body.adm.dk .chip.off{color:var(--mut);border-color:var(--line)}
.tst{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:90;background:#1e1b4b;color:#fff;padding:12px 20px;border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.3);max-width:90vw;transition:.3s var(--ez)}
.tst.show{opacity:1;transform:translate(-50%,0)}.tst.bad{background:#be123c}
th.so{cursor:pointer;user-select:none;white-space:nowrap}th.so:hover{color:var(--pri)}
.ss{padding:0 4px 12px;position:relative}
.ss input{margin:0;background:rgba(255,255,255,.1)!important;border-color:rgba(255,255,255,.22)!important;color:#fff!important;padding:8px 12px;font-size:14px}
.ss input::placeholder{color:#a5b4fc!important}
#gr{position:absolute;left:4px;right:4px;top:44px;background:#fff;border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.3);z-index:60;overflow:hidden}#gr:empty{display:none}
.sr{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:9px 12px;color:#1e1b4b;cursor:pointer;border-bottom:1px solid #eee}.sr:last-child{border:0}.sr:hover{background:#eef2ff}
.sr b{display:block;font-size:14px;line-height:1.3}.sr small{color:#625f8a}.sr u{color:#4f46e5;font-size:13px;white-space:nowrap}
.ins{display:grid;gap:8px;margin:0 0 14px}
.ins>div{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:rgba(79,70,229,.07);border:1px solid var(--line)}
.ins span{font-size:22px;line-height:1.3}.ins p{margin:0;font-weight:600;color:var(--mut);font-size:14px}.ins b{display:block;color:var(--ink);font-size:15px}
body[data-th] .ins>div{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18)}
.agree{display:grid!important;grid-template-columns:20px minmax(0,1fr);column-gap:10px;align-items:start;width:100%;height:auto!important;margin:14px 0;padding:0;cursor:pointer;font-weight:700;line-height:1.5;text-align:start;position:static!important}.agree.bad{outline:2px solid var(--bad);outline-offset:6px;border-radius:8px}.agree input{width:18px!important;height:18px!important;margin:2px 0 0!important;padding:0;position:static!important}.agree span{display:block!important;width:auto!important;min-width:0;white-space:normal!important;word-break:normal!important;overflow-wrap:break-word!important;position:static!important}
.nm{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.nm span{padding:3px 10px;border-radius:99px;background:rgba(79,70,229,.1);font-size:13px}
body.acb #app{-webkit-user-select:none;user-select:none}
body.acb #app textarea,body.acb #app input{-webkit-user-select:text;user-select:text}
.dr{z-index:60}
.fab{position:fixed;right:22px;bottom:22px;z-index:20;border-radius:999px;padding:14px 22px;box-shadow:0 10px 24px rgba(79,70,229,.4)}
@media print{.fab{display:none!important}.sb,.tb,.ov{display:none!important}.mn{margin:0!important;padding:0!important}}
</style>

    <script>
      (function () {
        const esc = (s) =>
          String(s).replace(
            /[&<>]/g,
            (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c],
          );
        const show = (m, x) => {
          const a = document.getElementById("app");
          if (a && /Loading/.test(a.textContent))
            a.innerHTML =
              '<div class="card"><h2>The app could not start</h2><div class="err" style="margin:8px 0;word-break:break-word">' +
              esc(m) +
              "</div>" +
              (x
                ? '<pre style="white-space:pre-wrap;word-break:break-all;font-size:12px;background:#f3f2ff;padding:10px;border-radius:10px;direction:ltr;text-align:left">' +
                  esc(x) +
                  "</pre>"
                : "") +
              '<button onclick="location.reload()">Reload</button></div>';
        };
        const locate = (m) => {
          try {
            const want = String(m).replace(/^Uncaught\s+\w+:\s*/, ""),
              sc = [].slice
                .call(document.scripts)
                .map((s) => s.text)
                .find(
                  (t) =>
                    t.indexOf("const S" + "K=") >= 0 && t.indexOf("locate") < 0,
                );
            if (!sc) return "main script not found";
            const bad = (n) => {
              try {
                new Function(sc.slice(0, n));
                return false;
              } catch (e) {
                return e.message === want;
              }
            };
            let lo = 0,
              hi = sc.length;
            if (!bad(hi))
              return (
                "not reproducible by re-parsing (script length " +
                sc.length +
                ")"
              );
            while (lo < hi) {
              const mid = (lo + hi) >> 1;
              bad(mid) ? (hi = mid) : (lo = mid + 1);
            }
            return (
              "script length " +
              sc.length +
              ", error at char " +
              lo +
              "\n..." +
              sc.slice(Math.max(0, lo - 200), lo) +
              " [[ERROR HERE]] " +
              sc.slice(lo, lo + 80) +
              "..."
            );
          } catch (x) {
            return "locate failed: " + x.message;
          }
        };
        let last = "";
        addEventListener("error", (e) => {
          last = e.message || "Script error";
        });
        addEventListener("unhandledrejection", (e) => {
          last = (e.reason && e.reason.message) || e.reason || "Unknown error";
        });
        setTimeout(() => {
          if (last) show(last, locate(last));
        }, 3000);
        setTimeout(
          () =>
            show(
              "Still loading after 12 seconds. Check your connection, then reload. If it keeps happening, open the page in a private window.",
            ),
          12000,
        );
      })();
    </script>

              if (m.complete && m.naturalWidth)
                x.drawImage(m, -p.s / 2, -p.s / 2, p.s, p.s);
            }
            x.restore();
          });
          if (!RM && !document.hidden) requestAnimationFrame(draw);
          else if (!RM) setTimeout(() => requestAnimationFrame(draw), 400);
        };
        requestAnimationFrame(draw);
        if (RM) setTimeout(() => requestAnimationFrame(draw), 500);
      })();
      const SFX = (() => {
        let c,
          on = true;
        try {
          on = localStorage.getItem("sfx") != "0";
        } catch (e) {}
        const T = (f, t0, d, ty, v, f2) => {
          if (!on) return;
          try {
            c = c || new (window.AudioContext || window.webkitAudioContext)();
            if (c.state == "suspended") c.resume();
            const o = c.createOscillator(),
              g = c.createGain(),
              t = c.currentTime + t0;
            o.type = ty;
            o.frequency.setValueAtTime(f, t);
            if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
            g.gain.setValueAtTime(0.0001, t);
            g.gain.exponentialRampToValueAtTime(v, t + 0.01);
            g.gain.exponentialRampToValueAtTime(0.0001, t + d);
            o.connect(g);
            g.connect(c.destination);
            o.start(t);
            o.stop(t + d + 0.05);
          } catch (e) {}
        };
        return {
          click: () => T(720, 0, 0.07, "triangle", 0.12, 420),
          start: () =>
            [523, 659, 784, 1047].forEach((f, i) =>
              T(f, i * 0.09, 0.2, "triangle", 0.16),
            ),
          win: () =>
            [523, 659, 784, 1047, 1319].forEach((f, i) =>
              T(f, i * 0.11, 0.3, "triangle", 0.17),
            ),
          lose: () =>
            [392, 330, 262].forEach((f, i) =>
              T(f, i * 0.2, 0.32, "sawtooth", 0.08, f * 0.85),
            ),
          tick: () => T(1000, 0, 0.05, "square", 0.06),
          toggle: () => {
            on = !on;
            try {
              localStorage.setItem("sfx", on ? "1" : "0");
            } catch (e) {}
          },
          get on() {
            return on;
          },
        };
      })();
      document.addEventListener("pointerdown", (e) => {
        const b = e.target.closest && e.target.closest("button");
        if (b && !b.disabled && b.id != "snd")
          (b.id == "go" ? SFX.start : SFX.click)();
        if (!b || b.disabled || RM) return;
        const r = b.getBoundingClientRect(),
          s = Math.max(r.width, r.height) * 2,
          d = document.createElement("i");
        d.className = "rip";
        d.style.cssText = `width:${s}px;height:${s}px;left:${e.clientX - r.left - s / 2}px;top:${e.clientY - r.top - s / 2}px`;
        b.appendChild(d);
        setTimeout(() => d.remove(), 650);
      });
      function countUp(el, to) {
        if (!el) return;
        if (RM) {
          el.textContent = to + "%";
          return;
        }
        const t0 = performance.now();
        (function f(t) {
          const k = Math.min(1, (t - t0) / 1100);
          el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))) + "%";
          if (k < 1) requestAnimationFrame(f);
        })(t0);
      }
      function confetti() {
        if (RM) return;
        const c = document.createElement("canvas"),
          K = [
            "#7c3aed",
            "#22c55e",
            "#f59e0b",
            "#ec4899",
            "#06b6d4",
            "#6366f1",
          ];
        c.id = "cf";
        c.width = innerWidth;
        c.height = innerHeight;
        document.body.appendChild(c);
        const g = c.getContext("2d"),
          R = Math.random,
          P = Array.from({ length: 130 }, () => ({
            x: R() * c.width,
            y: -20 - R() * c.height * 0.6,
            w: 6 + R() * 7,
            h: 10 + R() * 8,
            vx: (R() - 0.5) * 3,
            vy: 2 + R() * 4,
            r: R() * 6,
            vr: (R() - 0.5) * 0.3,
            c: K[(R() * 6) | 0],
          })),
          t0 = performance.now();
        (function f(t) {
          g.clearRect(0, 0, c.width, c.height);
          P.forEach((p) => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.04;
            p.r += p.vr;
            g.save();
            g.translate(p.x, p.y);
            g.rotate(p.r);
            g.fillStyle = p.c;
            g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
            g.restore();
          });
          t - t0 < 4500 ? requestAnimationFrame(f) : c.remove();
        })(t0);
      }
      (function () {
        const b = document.createElement("button");
        b.className = "g np";
        b.id = "snd";
        b.title = "Sound on/off";
        b.style.cssText =
          "position:fixed;right:14px;bottom:14px;z-index:25;padding:8px 12px;font-size:18px;border-radius:99px";
        const u = () => (b.textContent = SFX.on ? "🔊" : "🔇");
        u();
        b.onclick = () => {
          SFX.toggle();
          u();
        };
        document.body.appendChild(b);
      })();
      init();
    </script>
  </body>
</html>
